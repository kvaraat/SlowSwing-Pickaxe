
name: Build Slow Swing Pickaxe

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v5

      - name: Siapkan Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        run: gradle build --no-daemon

      - name: Simpan file mod
        uses: actions/upload-artifact@v4
        with:
          name: SlowSwing-Pickaxe
          path: build/libs/*.jar
          if-no-files-found: error
          
