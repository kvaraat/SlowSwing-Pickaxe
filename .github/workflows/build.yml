
name: Build Slow Swing Pickaxe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create mod project
        shell: bash
        run: |
          mkdir -p src/main/java/com/rhavael/slowswing/mixin
          mkdir -p src/main/resources

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'slow-swing-pickaxe'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.3
          loader_version=0.18.1
          mod_version=1.0.0
          maven_group=com.rhavael
          archives_base_name=slow-swing-pickaxe
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              maven { url = 'https://maven.fabricmc.net/' }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
          }

          processResources {
              inputs.property 'version', project.version
              filesMatching('fabric.mod.json') {
                  expand 'version': project.version
              }
          }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(21)
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "slow_swing_pickaxe",
            "version": "${version}",
            "name": "Slow Swing Pickaxe",
            "description": "Slows pickaxe swing animation.",
            "environment": "client",
            "mixins": ["slow_swing_pickaxe.mixins.json"],
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "1.21.11",
              "java": ">=21"
            }
          }
          EOF

          cat > src/main/resources/slow_swing_pickaxe.mixins.json <<'EOF'
          {
            "required": true,
            "package": "com.rhavael.slowswing.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "mixins": ["LivingEntityMixin"],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat > src/main/java/com/rhavael/slowswing/mixin/LivingEntityMixin.java <<'EOF'
          package com.rhavael.slowswing.mixin;

          import net.minecraft.entity.LivingEntity;
          import net.minecraft.item.PickaxeItem;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(LivingEntity.class)
          public abstract class LivingEntityMixin {
              @Inject(
                  method = "getHandSwingDuration",
                  at = @At("RETURN"),
                  cancellable = true
              )
              private void slowSwingPickaxe(
                  CallbackInfoReturnable<Integer> cir
              ) {
                  LivingEntity entity = (LivingEntity) (Object) this;

                  if (entity.getMainHandStack().getItem()
                      instanceof PickaxeItem) {
                      cir.setReturnValue(
                          Math.max(1, cir.getReturnValue() * 3)
                      );
                  }
              }
          }
          EOF

      - name: Build mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Slow-Swing-Pickaxe
          path: build/libs/*.jar
          
